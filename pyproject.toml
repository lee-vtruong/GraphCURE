[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcure"
version = "0.1.0"
description = "Intervention-faithful multimodal fact verification with value-of-information evidence acquisition"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "timm>=1.0",
  "pillow>=10",
  "pyyaml>=6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["accelerate>=1.0", "wandb>=0.18", "tensorboard>=2.17"]
retrieval = ["sentence-transformers>=3.2", "faiss-cpu>=1.8"]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["graphcure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
